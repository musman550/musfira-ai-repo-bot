name: Musfira AI Daily Repo Generator

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null && break
            sleep 2
          done

      - name: Pull models
        run: |
          ollama pull llama3.2:1b
          ollama pull qwen2.5:1.5b
          ollama pull gemma2:2b

      - name: Run daily orchestrator
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_USERNAME: ${{ secrets.GH_USERNAME }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CX: ${{ secrets.GOOGLE_CX }}
          YOUTUBE_CHANNEL_URL: ${{ vars.YOUTUBE_CHANNEL_URL }}
          WEBSITE_URL: ${{ vars.WEBSITE_URL }}
          LINKEDIN_URL: ${{ vars.LINKEDIN_URL }}
          INSTAGRAM_URL: ${{ vars.INSTAGRAM_URL }}
          GMAPS_URL: ${{ vars.GMAPS_URL }}
          REPOS_PER_DAY_MIN: "2"
          REPOS_PER_DAY_MAX: "5"
          OLLAMA_MODELS: "llama3.2:1b,qwen2.5:1.5b,gemma2:2b"
          INFRA_REPO: "musfira-ai-repo-bot"
        run: python scripts/orchestrator.py

      - name: Show Ollama log on failure
        if: failure()
        run: cat ollama.log || true
